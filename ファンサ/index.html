<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111026">
  <title>レスくれ！ - Idols &amp; Lightsticks -</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Yu Gothic UI", "Meiryo", sans-serif;
      background: #100f21;
      color: #fff;
      font-synthesis: none;
      font-optical-sizing: auto;
      font-smooth: always;
      --muted: #a7a5bc;
      --panel: rgba(31, 29, 55, .91);
      --line: rgba(255, 255, 255, .1);
      --pink: #ff79bc;
      --gold: #ffe198;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 50% -18%, rgba(119, 87, 181, .28), transparent 49%),
        radial-gradient(ellipse at 50% 100%, rgba(231, 82, 151, .08), transparent 38%),
        #100f21;
    }

    button { font: inherit; }

    .app {
      width: min(900px, calc(100% - 32px), calc((100svh - 220px) * 1.6));
      margin: 0 auto;
      padding: 12px 0;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 10px;
    }

    .brand { display: flex; align-items: center; gap: 11px; }

    .brand-mark {
      display: grid;
      width: 43px;
      height: 43px;
      place-items: center;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 15px;
      background: linear-gradient(145deg, #ff96ca, #ac76ea);
      box-shadow: 0 6px 24px rgba(255, 121, 188, .23);
      font-size: 22px;
    }

    .brand h1 { margin: 0; font-size: 18px; letter-spacing: .035em; }
    .brand p { margin: 3px 0 0; color: var(--muted); font-size: 10px; letter-spacing: .18em; }

    .live-badge, .chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .045);
      color: #dfddec;
      font-size: 11px;
      padding: 7px 12px;
      white-space: nowrap;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ff6588;
      box-shadow: 0 0 10px #ff6588;
    }

    .topbar-actions { display: flex; align-items: center; gap: 8px; }

    .music-button {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid rgba(198, 169, 255, .26);
      border-radius: 999px;
      background: rgba(165, 126, 231, .1);
      color: #e5dcff;
      cursor: pointer;
      font-size: 10px;
      font-weight: 700;
      transition: background .2s ease, border-color .2s ease;
    }

    .music-button:hover { border-color: rgba(222, 194, 255, .6); background: rgba(165, 126, 231, .2); }
    .music-button[aria-pressed="true"] { border-color: rgba(255, 181, 222, .5); color: #ffd1ed; }
    .music-button[data-error="true"] { border-color: rgba(255, 111, 130, .72); color: #ffc0c9; }
    .music-icon { display: inline-block; width: 15px; text-align: center; }

    .hud {
      display: grid;
      grid-template-columns: minmax(185px, .95fr) minmax(270px, 1.4fr) minmax(105px, .5fr);
      gap: 12px;
      margin-bottom: 9px;
    }

    .hud-card {
      min-height: 72px;
      padding: 12px 15px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: var(--panel);
      backdrop-filter: blur(12px);
    }

    .hud-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: .08em;
    }

    .member-line { display: flex; align-items: center; gap: 10px; margin-top: 7px; }
    .member-dot { width: 11px; height: 11px; border-radius: 50%; box-shadow: 0 0 12px currentColor; }
    .member-name { font-size: 16px; font-weight: 800; }
    .member-caption { color: var(--muted); font-size: 10px; }

    .meter-line { display: flex; align-items: baseline; justify-content: space-between; margin: 6px 0 8px; }
    .meter-value { color: #fff; font-size: 19px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .meter-goal { color: var(--muted); font-size: 10px; }

    .meter-track {
      position: relative;
      height: 8px;
      overflow: hidden;
      border-radius: 99px;
      background: rgba(255, 255, 255, .09);
    }

    .meter-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #a873ff, #ff83c1 70%, #ffe1a0);
      box-shadow: 0 0 15px rgba(255, 131, 193, .7);
      transition: width .25s ease;
    }

    .meter-goal-mark {
      position: absolute;
      top: -2px;
      bottom: -2px;
      left: 70%;
      width: 2px;
      background: white;
      opacity: .8;
    }

    .timer-card { display: flex; flex-direction: column; justify-content: center; }
    .timer { margin-top: 3px; font-size: 27px; font-weight: 850; font-variant-numeric: tabular-nums; letter-spacing: .03em; }
    .timer.urgent { color: #ff8394; animation: pulse .7s ease-in-out infinite alternate; }

    .stage-shell {
      position: relative;
      aspect-ratio: 8 / 5;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 20px;
      background: #19172d;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35), 0 0 45px rgba(163, 109, 222, .1);
    }

    canvas { display: block; width: 100%; height: 100%; cursor: crosshair; touch-action: none; }
    canvas:focus-visible { outline: 2px solid #ffd1ed; outline-offset: -4px; }

    .stage-topline {
      position: absolute;
      z-index: 1;
      top: 13px;
      right: 14px;
      left: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
      pointer-events: none;
    }

    .stage-chip { background: rgba(18, 16, 36, .72); backdrop-filter: blur(8px); }
    .stage-chip b { color: #fff; }
    .venue-badge { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
    .streak { color: #ffe092; }

    .overlay {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(12, 10, 28, .53);
      backdrop-filter: blur(5px);
      transition: opacity .25s ease, visibility .25s ease;
    }

    .overlay[hidden] { display: none; }

    .dialog {
      width: min(420px, 100%);
      padding: 29px 27px 25px;
      border: 1px solid rgba(255, 255, 255, .17);
      border-radius: 22px;
      background: linear-gradient(150deg, rgba(42, 37, 71, .98), rgba(24, 21, 48, .98));
      box-shadow: 0 25px 80px rgba(0, 0, 0, .45);
      text-align: center;
    }

    .dialog-kicker { color: #e2a8ff; font-size: 10px; font-weight: 700; letter-spacing: .22em; }
    .dialog h2 { margin: 9px 0 8px; font-size: clamp(24px, 5vw, 35px); letter-spacing: .04em; }
    .dialog p { margin: 0 auto; max-width: 315px; color: #c3bfd5; font-size: 13px; line-height: 1.8; }
    .dialog .small-note { margin-top: 12px; color: #928ea7; font-size: 10px; }

    .primary-button {
      min-width: 175px;
      margin-top: 21px;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(100deg, #ff82bd, #be88ff);
      box-shadow: 0 7px 23px rgba(255, 116, 190, .25);
      color: #23152c;
      cursor: pointer;
      font-size: 14px;
      font-weight: 800;
      transition: transform .18s ease, filter .18s ease;
    }

    .primary-button:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.08); }
    .primary-button:focus-visible, .fever-button:focus-visible { outline: 2px solid white; outline-offset: 3px; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px 2px 0;
    }

    .hints { display: flex; flex-wrap: wrap; gap: 8px 15px; color: var(--muted); font-size: 11px; }
    .hint { display: inline-flex; align-items: center; gap: 6px; }

    kbd {
      min-width: 21px;
      padding: 3px 6px;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: 5px;
      background: rgba(255, 255, 255, .07);
      color: #ebe7f7;
      font: inherit;
      font-size: 10px;
      text-align: center;
    }

    .fever-wrap { display: flex; align-items: center; gap: 9px; }
    .fever-track { width: 90px; height: 5px; overflow: hidden; border-radius: 99px; background: rgba(255, 255, 255, .1); }
    .fever-fill { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ffd373, #ff8e72); transition: width .2s ease; }

    .fever-button {
      min-width: 112px;
      padding: 9px 12px;
      border: 1px solid rgba(255, 219, 136, .35);
      border-radius: 10px;
      background: rgba(255, 191, 100, .1);
      color: #e8dfd3;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      transition: .2s ease;
    }

    .fever-button.ready { border-color: #ffe199; background: linear-gradient(100deg, #ffc56c, #ff92a7); color: #2b1c2b; box-shadow: 0 0 20px rgba(255, 187, 105, .24); }
    .fever-button:disabled { cursor: default; opacity: .6; }

    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }

    @keyframes pulse { to { opacity: .65; } }

    @media (max-width: 650px) {
      .app { width: calc(100% - 22px); padding: 9px 0; }
      .topbar { margin-bottom: 10px; }
      .brand-mark { width: 38px; height: 38px; border-radius: 13px; }
      .brand h1 { font-size: 16px; }
      .live-badge { font-size: 10px; padding: 6px 9px; }
      .hud { grid-template-columns: minmax(115px, .85fr) minmax(145px, 1.1fr) 80px; gap: 7px; margin-bottom: 8px; }
      .hud-card { min-height: 66px; padding: 9px 10px; border-radius: 12px; }
      .hud-label { font-size: 9px; }
      .member-line { gap: 7px; margin-top: 9px; }
      .member-name { font-size: 13px; }
      .member-caption { display: none; }
      .meter-value { font-size: 16px; }
      .timer { font-size: 23px; }
      .stage-shell { border-radius: 15px; }
      .stage-topline { top: 8px; right: 8px; left: 8px; }
      .stage-chip { padding: 6px 9px; font-size: 9px; }
      .footer { align-items: flex-start; padding-top: 9px; }
      .hints { gap: 7px 10px; font-size: 10px; }
      .fever-track { width: 58px; }
      .fever-wrap { gap: 5px; }
      .fever-button { min-width: 91px; padding: 9px 7px; font-size: 10px; }
      .dialog { padding: 24px 19px 21px; }
    }

    @media (max-width: 410px) {
      .hud { grid-template-columns: 1fr 1.05fr 71px; }
      .hud-card { padding-right: 7px; padding-left: 7px; }
      .chip { font-size: 9px; padding: 6px 8px; }
      .hints .optional-hint { display: none; }
      .fever-track { display: none; }
    }

    @media (max-width: 650px) {
      .stage-shell { height: auto; min-height: 0; aspect-ratio: 8 / 5; }
      canvas { aspect-ratio: 8 / 5; }
      .overlay { padding: 8px; }
      .dialog { padding: 12px 12px 11px; border-radius: 16px; }
      .dialog-kicker { font-size: 8px; }
      .dialog h2 { margin: 4px 0; font-size: clamp(18px, 5vw, 25px); }
      .dialog p { font-size: 10px; line-height: 1.55; }
      .dialog .small-note { margin-top: 5px; font-size: 9px; }
      .primary-button { min-width: 145px; margin-top: 8px; padding: 8px 16px; font-size: 12px; }
    }

    @media (max-width: 410px) {
      .venue-badge { top: 37px; }
    }

    @media (max-height: 650px) and (min-width: 411px) {
      .app { padding: 6px 0; }
      .topbar { margin-bottom: 6px; }
      .hud { margin-bottom: 6px; }
      .hud-card { min-height: 58px; padding-top: 7px; padding-bottom: 7px; }
      .footer { padding-top: 6px; }
      .dialog { padding: 14px 19px 13px; }
      .dialog h2 { margin: 5px 0; }
      .dialog p { font-size: 12px; line-height: 1.55; }
      .dialog .small-note { margin-top: 5px; }
      .primary-button { margin-top: 10px; padding: 9px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <h1>レスくれ！</h1>
          <p>IDOLS &amp; LIGHTSTICKS</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="music-button" id="musicToggle" type="button" aria-pressed="false" aria-label="BGMを再生">
          <span class="music-icon" aria-hidden="true">♫</span><span id="musicStatus">BGM OFF</span>
        </button>
        <div class="live-badge"><span class="live-dot" aria-hidden="true"></span>LIVE NOW</div>
      </div>
    </header>

    <section class="hud" aria-label="ライブ情報">
      <div class="hud-card">
        <div class="hud-label"><span>今日のレス担当</span><span id="levelLabel">STAGE 01</span></div>
        <div class="member-line">
          <span class="member-dot" id="memberDot"></span>
          <span class="member-name" id="memberName">メンバー待機中</span>
          <span class="member-caption" id="memberCaption">ランダム選出</span>
        </div>
      </div>
      <div class="hud-card">
        <div class="hud-label"><span>会場ボルテージ</span><span class="meter-goal" id="goalLabel">GOAL 70%</span></div>
        <div class="meter-line"><span class="meter-value" id="voltageValue">0%</span><span class="meter-goal">みんなの士気</span></div>
        <div class="meter-track" id="voltageTrack" role="progressbar" aria-label="会場ボルテージ" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="meter-fill" id="voltageFill"></div><span class="meter-goal-mark" id="goalMark"></span>
        </div>
      </div>
      <div class="hud-card timer-card">
        <div class="hud-label"><span>SONG</span><span>残り</span></div>
        <div class="timer" id="timer" aria-label="残り時間">55</div>
      </div>
    </section>

    <section class="stage-shell" aria-label="ライブステージ">
      <div class="stage-topline" aria-hidden="true">
        <span class="chip stage-chip"><b id="stageName">OPENING</b>&nbsp; <span id="stageCue">開演前</span></span>
        <span class="chip stage-chip venue-badge" id="venueBadge" hidden></span>
        <span class="chip stage-chip streak" id="streakLabel">✦ 0 レス</span>
      </div>
      <canvas id="stage" width="960" height="600" tabindex="0" aria-label="ステージ。ファンの上にポインターを合わせてファンサを送ろう"></canvas>
      <div class="overlay" id="overlay">
        <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogDescription">
          <div class="dialog-kicker" id="dialogKicker">YOUR GAZE, THEIR LIGHT</div>
          <h2 id="dialogTitle">レス、届けよう！</h2>
          <p id="dialogDescription">ファンに視線を合わせて、会場を最高の熱気に。担当カラーのペンライトにレスすると、もっと盛り上がるよ！</p>
          <p class="small-note" id="dialogNote">曲が終わるまでに目標ボルテージを目指そう。</p>
          <button class="primary-button" id="startButton" type="button">ライブスタート！</button>
        </section>
      </div>
    </section>

    <footer class="footer">
      <div class="hints">
        <span class="hint">ファンにポインターを合わせてレス！</span>
        <span class="hint optional-hint"><kbd>SPACE</kbd> 必殺ファンサ</span>
        <span class="hint optional-hint">同じ色のペンライトは効果アップ</span>
      </div>
      <div class="fever-wrap">
        <div class="fever-track" aria-hidden="true"><div class="fever-fill" id="feverFill"></div></div>
        <button class="fever-button" id="feverButton" type="button" disabled>✨ 必殺ファンサ</button>
      </div>
    </footer>
    <div class="sr-only" id="liveAnnouncer" aria-live="polite"></div>
    <audio id="bgm" src="music/Yami_wo_Tsuranuite.mp3" preload="auto" loop></audio>
  </main>

  <script>
    (() => {
      const members = [
        { id: "au", name: "兎二角あう", color: "#ff71b8", colorName: "ピンク" },
        { id: "koyuru", name: "七瀬こゆる", color: "#b28aff", colorName: "紫" },
        { id: "satan", name: "さたん", color: "#72d9f5", colorName: "水色" },
        { id: "momo", name: "茉白もも", color: "#f7f5ff", colorName: "白" },
        { id: "sayu", name: "星野さゆ", color: "#ff667a", colorName: "赤" }
      ];
      const venues = [
        {
          name: "THEATER",
          wall: "#20182f",
          floor: "#30213e",
          trim: "#e5acd1",
          lighting: "#f0acda",
          architecture: "theater",
          pillars: []
        },
        {
          name: "WAREHOUSE",
          wall: "#182431",
          floor: "#243444",
          trim: "#87c9dd",
          lighting: "#9bcdf5",
          architecture: "warehouse",
          pillars: []
        },
        {
          name: "UNDERGROUND",
          wall: "#271a33",
          floor: "#33253b",
          trim: "#c297f3",
          lighting: "#d0a6ff",
          architecture: "underground",
          pillars: []
        },
        {
          name: "ROOFTOP",
          wall: "#17233b",
          floor: "#25304a",
          trim: "#8baef1",
          lighting: "#a7bcff",
          architecture: "rooftop",
          pillars: []
        },
        {
          name: "LIVE HOUSE",
          wall: "#2b192b",
          floor: "#38223a",
          trim: "#ee91a8",
          lighting: "#ff9fbe",
          architecture: "livehouse",
          pillars: []
        }
      ];
      const formations = [
        {
          end: 5,
          positions: [[480, 328], [420, 304], [540, 304], [360, 276], [600, 276]]
        },
        {
          end: 11,
          positions: [[480, 328], [405, 276], [555, 276], [330, 326], [630, 326]]
        },
        {
          end: 17,
          positions: [[480, 292], [330, 328], [630, 328], [405, 276], [555, 276]]
        },
        {
          end: 22,
          positions: [[480, 314], [420, 276], [540, 276], [360, 314], [600, 314]]
        },
        {
          end: 27,
          positions: [[480, 346], [400, 276], [560, 276], [280, 318], [680, 318]]
        },
        {
          end: 34,
          positions: [[480, 326], [405, 272], [555, 272], [325, 326], [635, 326]]
        },
        {
          end: 41,
          positions: [[480, 270], [310, 312], [650, 312], [225, 344], [735, 344]]
        },
        {
          end: 48,
          positions: [[480, 326], [480, 250], [560, 346], [390, 298], [590, 298]]
        },
        {
          end: 55,
          positions: [[480, 342], [410, 286], [550, 286], [330, 326], [630, 326]]
        }
      ];
      const stage = document.querySelector("#stage");
      const ctx = stage.getContext("2d");
      const bgm = document.querySelector("#bgm");
      const musicToggle = document.querySelector("#musicToggle");
      const musicStatus = document.querySelector("#musicStatus");
      const overlay = document.querySelector("#overlay");
      const startButton = document.querySelector("#startButton");
      const feverButton = document.querySelector("#feverButton");
      const memberName = document.querySelector("#memberName");
      const memberDot = document.querySelector("#memberDot");
      const levelLabel = document.querySelector("#levelLabel");
      const goalLabel = document.querySelector("#goalLabel");
      const goalMark = document.querySelector("#goalMark");
      const voltageValue = document.querySelector("#voltageValue");
      const voltageFill = document.querySelector("#voltageFill");
      const voltageTrack = document.querySelector("#voltageTrack");
      const timerLabel = document.querySelector("#timer");
      const stageName = document.querySelector("#stageName");
      const stageCue = document.querySelector("#stageCue");
      const venueBadge = document.querySelector("#venueBadge");
      const streakLabel = document.querySelector("#streakLabel");
      const feverFill = document.querySelector("#feverFill");
      const liveAnnouncer = document.querySelector("#liveAnnouncer");
      let musicError = false;

      const fans = [];
      const particles = [];
      const pointer = { x: -100, y: -100, active: false, down: false };
      const state = {
        mode: "ready",
        level: 1,
        member: null,
        remaining: 55,
        elapsed: 0,
        voltage: 0,
        goal: 70,
        fever: 0,
        feverSeconds: 0,
        streak: 0,
        lastFocus: null,
        transition: 0,
        venue: null,
        idolPositions: formations[0].positions
      };

      const imageById = Object.fromEntries(members.map(member => {
        const image = new Image();
        image.src = `pic/${member.id}.png`;
        image.addEventListener("error", () => {
          liveAnnouncer.textContent = `${member.name}の画像を読み込めませんでした。picフォルダーの画像を確認してください。`;
          console.error(`Failed to load idol image: pic/${member.id}.png`);
        });
        return [member.id, image];
      }));

      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const random = (min, max) => min + Math.random() * (max - min);
      const isChorus = elapsed => elapsed >= 27 && elapsed < 41;

      function getIdolPositions(elapsed, now) {
        let currentIndex = formations.findIndex(formation => elapsed < formation.end);
        if (currentIndex < 0) currentIndex = formations.length - 1;
        const current = formations[currentIndex];
        const transitionDuration = 1.6;
        const next = formations[currentIndex + 1];
        const transitionStart = current.end - transitionDuration;
        const transitionProgress = next ? clamp((elapsed - transitionStart) / transitionDuration, 0, 1) : 0;
        const easedProgress = transitionProgress * transitionProgress * (3 - 2 * transitionProgress);

        return current.positions.map((position, index) => {
          const currentPosition = spreadFormationPosition(position);
          const nextPosition = next ? spreadFormationPosition(next.positions[index]) : currentPosition;
          const positionX = currentPosition[0] + (nextPosition[0] - currentPosition[0]) * easedProgress;
          const positionY = currentPosition[1] + (nextPosition[1] - currentPosition[1]) * easedProgress;
          const motion = Math.max(0, elapsed) + index * .65;
          return [
            positionX + Math.sin(now * .0018 + motion) * 3.5,
            positionY + Math.sin(now * .0024 + motion) * 1.6
          ];
        });
      }

      const hexToRgba = (hex, alpha) => {
        const value = hex.slice(1);
        const parts = value.length === 3
          ? value.split("").map(channel => parseInt(channel + channel, 16))
          : [parseInt(value.slice(0, 2), 16), parseInt(value.slice(2, 4), 16), parseInt(value.slice(4, 6), 16)];
        return `rgba(${parts[0]}, ${parts[1]}, ${parts[2]}, ${alpha})`;
      };

      function resizeCanvas() {
        const rect = stage.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1;
        stage.width = Math.round(rect.width * ratio);
        stage.height = Math.round(rect.height * ratio);
        ctx.setTransform(stage.width / 960, 0, 0, stage.height / 600, 0, 0);
      }

      function updateMusicControl() {
        const isPlaying = !bgm.paused && !bgm.ended;
        musicStatus.textContent = musicError ? "BGM ERROR" : isPlaying ? "BGM ON" : "BGM OFF";
        musicToggle.dataset.error = String(musicError);
        musicToggle.setAttribute("aria-pressed", String(isPlaying));
        musicToggle.setAttribute("aria-label", musicError ? "BGMエラー。クリックして再試行" : isPlaying ? "BGMを停止" : "BGMを再生");
      }

      function playBgm(restart = false) {
        musicError = false;
        if (restart) bgm.currentTime = 0;
        bgm.volume = .38;
        const playback = bgm.play();
        if (!playback) {
          musicError = true;
          updateMusicControl();
          liveAnnouncer.textContent = "このブラウザーではBGMを再生できません。";
          console.error("The browser did not return a playback promise for the stage BGM.");
          return;
        }
        playback.then(updateMusicControl).catch(error => {
          musicError = true;
          updateMusicControl();
          liveAnnouncer.textContent = "BGMを再生できませんでした。BGMボタンからもう一度お試しください。";
          console.error("Failed to play the stage BGM.", error);
        });
      }

      function stopBgm() {
        bgm.pause();
        updateMusicControl();
      }

      function fanPositions(count) {
        const positions = [];
        const rows = Math.ceil(count / 8);
        const rowSpacing = rows > 1 ? Math.min(49, 155 / (rows - 1)) : 0;
        const firstRowY = rows > 1 ? 410 : 460;
        for (let row = 0; row < rows; row++) {
          const inRow = Math.ceil((count - positions.length) / (rows - row));
          const left = 76 + row * 10;
          const right = 884 - row * 10;
          for (let i = 0; i < inRow; i++) {
            const x = inRow === 1 ? 480 : left + (right - left) * (i / (inRow - 1));
            const stagger = (row % 2) * Math.min(9, rowSpacing * .2) + (i % 2) * 2;
            positions.push({ x, y: firstRowY + row * rowSpacing + stagger, row });
          }
        }
        return positions;
      }

      function createCrowd() {
        fans.length = 0;
        const count = Math.min(42, 16 + (state.level - 1) * 5);
        for (const [index, position] of fanPositions(count).entries()) {
          const favorite = Math.random() < .76 ? state.member : members[Math.floor(Math.random() * members.length)];
          const skinTones = ["#ffe0ce", "#f7d1bf", "#edc2aa", "#f9decf"];
          const hairTones = ["#282337", "#45303d", "#332c43", "#594147", "#242a3b"];
          const outfitTones = ["#554471", "#354667", "#704354", "#3c5961", "#584d70"];
          fans.push({
            ...position,
            size: position.row === 0 ? 1 : position.row === 1 ? .89 : .78,
            favorite: favorite.id,
            morale: random(48, 77),
            initialMorale: 0,
            lit: Math.random() > .31,
            cooldown: random(0, .4),
            wave: random(0, Math.PI * 2),
            cheers: index % 4 === 0,
            skin: skinTones[index % skinTones.length],
            hair: hairTones[(index * 3 + position.row) % hairTones.length],
            outfit: outfitTones[(index + position.row * 2) % outfitTones.length]
          });
        }
        for (const fan of fans) fan.initialMorale = fan.morale;
        state.venue.pillars = createRandomPillars();
      }

      function createRandomPillars() {
        const memberIndex = members.indexOf(state.member);
        const formationSamples = [];
        formations.forEach((formation, index) => {
          const current = formation.positions.map(position => spreadFormationPosition(position));
          formationSamples.push(current);
          const next = formations[index + 1];
          if (next) {
            const nextPositions = next.positions.map(position => spreadFormationPosition(position));
            for (const progress of [.25, .5, .75]) {
              formationSamples.push(current.map((position, performerIndex) => [
                position[0] + (nextPositions[performerIndex][0] - position[0]) * progress,
                position[1] + (nextPositions[performerIndex][1] - position[1]) * progress
              ]));
            }
          }
        });

        const blocksEveryRoute = pillars => fans.some(fan =>
          formationSamples.every(positions =>
            isRayBlocked(fan, positions[memberIndex], pillars)
          )
        );

        for (const pillarCount of [3, 2, 1]) {
          for (let attempt = 0; attempt < 110; attempt++) {
            const pillars = [];
            for (let index = 0; index < pillarCount; index++) {
              const pillar = {
                x: Math.round(random(118, 820)),
                top: Math.round(random(273, 329)),
                width: Math.round(random(22, 38)),
                bottom: Math.round(random(393, 414))
              };
              if (pillars.some(existing => Math.abs(existing.x - pillar.x) < 82)) {
                pillars.length = 0;
                break;
              }
              pillars.push(pillar);
            }

            if (pillars.length !== pillarCount) continue;
            if (!blocksEveryRoute(pillars)) return pillars;
          }
        }

        for (let attempt = 0; attempt < 1000; attempt++) {
          const pillar = {
            x: Math.round(random(118, 820)),
            top: Math.round(random(273, 329)),
            width: Math.round(random(22, 38)),
            bottom: Math.round(random(393, 414))
          };
          if (!blocksEveryRoute([pillar])) return [pillar];
        }

        console.warn("Could not place a reachable stage pillar layout; continuing without pillars.");
        return [];
      }

      function spreadFormationPosition([x, y]) {
        return [
          clamp(480 + (x - 480) * 1.28, 94, 866),
          clamp(310 + (y - 310) * 1.1, 237, 354)
        ];
      }

      function currentGoal() {
        return Math.min(70 + (state.level - 1) * 2, 88);
      }

      function updateHeader() {
        const average = fans.length
          ? fans.reduce((total, fan) => total + fan.morale, 0) / fans.length
          : 0;
        state.voltage = average;
        const value = Math.round(average);
        voltageValue.textContent = `${value}%`;
        voltageFill.style.width = `${value}%`;
        voltageTrack.setAttribute("aria-valuenow", String(value));
        levelLabel.textContent = `STAGE ${String(state.level).padStart(2, "0")}`;
        goalLabel.textContent = `GOAL ${state.goal}%`;
        goalMark.style.left = `${state.goal}%`;
        timerLabel.textContent = String(Math.ceil(state.remaining)).padStart(2, "0");
        timerLabel.classList.toggle("urgent", state.mode === "playing" && state.remaining <= 10);
        streakLabel.textContent = `✦ ${state.streak} レス`;
        feverFill.style.width = `${state.fever}%`;
        if (state.mode === "playing") {
          const chorus = isChorus(state.elapsed);
          stageName.textContent = chorus ? "CHORUS" : "VERSE";
          stageCue.textContent = chorus ? "サビ・レス効果UP!" : "Aメロ・Bメロ";
        } else if (state.mode === "ready") {
          stageName.textContent = "OPENING";
          stageCue.textContent = "開演前";
        }
        venueBadge.hidden = !state.venue || state.mode === "ready";
        if (state.venue) venueBadge.textContent = `♫ ${state.venue.name} · 柱 ${state.venue.pillars.length}本`;
        feverButton.disabled = state.mode !== "playing" || state.fever < 100;
        feverButton.classList.toggle("ready", state.mode === "playing" && state.fever >= 100);
        feverButton.setAttribute("aria-label", state.fever >= 100 ? "必殺ファンサを発動" : `必殺ファンサ ${Math.floor(state.fever)}パーセント`);
        memberDot.style.color = state.member ? state.member.color : "#a7a5bc";
        memberDot.style.background = state.member ? state.member.color : "#a7a5bc";
        memberName.textContent = state.member ? state.member.name : "メンバー待機中";
      }

      function beginLive(nextLevel = false) {
        if (nextLevel) state.level++;
        state.member = members[Math.floor(Math.random() * members.length)];
        state.goal = currentGoal();
        state.remaining = 55;
        state.elapsed = 0;
        state.fever = 0;
        state.feverSeconds = 0;
        state.streak = 0;
        state.lastFocus = null;
        state.transition = 0;
        state.mode = "playing";
        const availableVenues = venues.filter(venue => venue !== state.venue);
        state.venue = availableVenues[Math.floor(Math.random() * availableVenues.length)];
        state.idolPositions = getIdolPositions(0, performance.now());
        pointer.active = false;
        createCrowd();
        memberName.textContent = state.member.name;
        memberDot.style.color = state.member.color;
        memberDot.style.background = state.member.color;
        overlay.hidden = true;
        startButton.textContent = "ライブスタート！";
        liveAnnouncer.textContent = `ステージ${state.level}。担当は${state.member.name}、${state.member.colorName}。会場は${state.venue.name}。ライブスタート！`;
        playBgm(true);
        updateHeader();
        stage.focus({ preventScroll: true });
      }

      function finishLive(cleared) {
        if (state.mode !== "playing") return;
        state.mode = cleared ? "cleared" : "failed";
        pointer.down = false;
        state.transition = 0;
        stopBgm();
        const title = document.querySelector("#dialogTitle");
        const description = document.querySelector("#dialogDescription");
        const note = document.querySelector("#dialogNote");
        document.querySelector("#dialogKicker").textContent = cleared ? "ENCORE, PLEASE!" : "THE SONG HAS ENDED";
        title.textContent = cleared ? "大成功！最高のライブ！" : "あと一歩…！";
        description.textContent = cleared
          ? `会場ボルテージ${Math.round(state.voltage)}%達成！ファンのみんなに、たくさんのレスを届けたね。`
          : `会場ボルテージは${Math.round(state.voltage)}%。目標の${state.goal}%まで、もう少しだった！`;
        note.textContent = cleared
          ? "次のステージは観客が増えて、さらに熱いライブに！"
          : "同じ色のペンライトを探して、もう一度挑戦しよう。";
        startButton.textContent = cleared ? "次のステージへ！" : "もう一度チャレンジ";
        overlay.hidden = false;
        updateHeader();
        liveAnnouncer.textContent = cleared ? "ステージクリア！" : "ライブ終了。もう一度挑戦しよう。";
        startButton.focus();
      }

      function focusFan() {
        if (!pointer.active) return null;
        let closest = null;
        let nearest = Infinity;
        for (const fan of fans) {
          const dx = (pointer.x - fan.x) / fan.size;
          const dy = (pointer.y - fan.y) / fan.size;
          const distance = Math.hypot(dx, dy);
          if (distance < 32 && distance < nearest && !rayBlocked(fan)) {
            nearest = distance;
            closest = fan;
          }
        }
        return closest;
      }

      function rayBlocked(fan) {
        const memberIndex = members.findIndex(member => member === state.member);
        const [startX, memberY] = state.idolPositions[memberIndex] || [480, 328];
        const startY = memberY - 96;
        return isRayBlocked(fan, [startX, memberY], state.venue?.pillars || []);
      }

      function isRayBlocked(fan, performer, pillars) {
        const [startX, memberY] = performer;
        const startY = memberY - 96;
        const endX = fan.x;
        const endY = fan.y - 11 * fan.size;
        const dx = endX - startX;
        const dy = endY - startY;

        return pillars.some(pillar => {
          let entry = 0;
          let exit = 1;
          const bounds = [
            [-dx, startX - pillar.x],
            [dx, pillar.x + pillar.width - startX],
            [-dy, startY - pillar.top],
            [dy, pillar.bottom - startY]
          ];

          for (const [direction, distance] of bounds) {
            if (direction === 0) {
              if (distance < 0) return false;
              continue;
            }
            const intersection = distance / direction;
            if (direction < 0) {
              if (intersection > exit) return false;
              entry = Math.max(entry, intersection);
            } else {
              if (intersection < entry) return false;
              exit = Math.min(exit, intersection);
            }
          }
          return entry < .92 && exit > .08 && entry <= exit;
        });
      }

      function blockedFanAtPointer() {
        if (!pointer.active) return null;
        let closest = null;
        let nearest = Infinity;
        for (const fan of fans) {
          const distance = Math.hypot((pointer.x - fan.x) / fan.size, (pointer.y - fan.y) / fan.size);
          if (distance < 32 && distance < nearest && rayBlocked(fan)) {
            closest = fan;
            nearest = distance;
          }
        }
        return closest;
      }

      function burst(x, y, color, count = 8) {
        for (let index = 0; index < count; index++) {
          const angle = random(0, Math.PI * 2);
          const speed = random(28, 110);
          particles.push({
            x, y, color,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - random(15, 55),
            life: random(.4, .85),
            maxLife: .85,
            size: random(2, 5)
          });
        }
      }

      function activateFever() {
        if (state.mode !== "playing" || state.fever < 100) return;
        state.fever = 0;
        state.feverSeconds = 4;
        state.streak += 5;
        for (const fan of fans) {
          fan.morale = Math.min(100, fan.morale + 31);
          fan.lit = true;
          burst(fan.x, fan.y - 20, state.member.color, 2);
        }
        liveAnnouncer.textContent = "必殺ファンサ発動！みんなの士気が回復！";
        updateHeader();
      }

      function update(dt) {
        for (const fan of fans) {
          fan.wave += dt * (fan.cheers ? 3.5 : 1.7);
          fan.cooldown = Math.max(0, fan.cooldown - dt);
        }

        if (state.mode === "playing") {
          state.elapsed += dt;
          state.idolPositions = getIdolPositions(state.elapsed, performance.now());
          const focused = focusFan();
          state.remaining = Math.max(0, state.remaining - dt);
          state.feverSeconds = Math.max(0, state.feverSeconds - dt);
          const chorus = isChorus(state.elapsed);

          for (const fan of fans) {
            if (state.feverSeconds > 0) {
              fan.morale = Math.min(100, fan.morale + 2.4 * dt);
            } else if (fan === focused) {
              const isMatch = fan.favorite === state.member.id;
              const multiplier = (isMatch ? 1.85 : .95) * (chorus ? 1.45 : 1);
              fan.morale = Math.min(100, fan.morale + 26 * multiplier * dt);
              state.fever = Math.min(100, state.fever + (isMatch ? 9 : 5) * dt);
              if (!fan.lit && fan.morale >= 57) {
                fan.lit = true;
                liveAnnouncer.textContent = "一見さんがファンになった！ペンライトが点灯！";
                burst(fan.x, fan.y - 14, state.member.color, 12);
              }
              if (fan.cooldown === 0) {
                fan.cooldown = .23;
                burst(fan.x, fan.y - 13, isMatch ? state.member.color : "#fff0cb", 4);
              }
            } else {
              const decay = fan.lit ? 1.15 : .7;
              fan.morale = Math.max(0, fan.morale - decay * dt);
              if (fan.morale < 10) fan.lit = false;
            }
          }

          if (focused && focused !== state.lastFocus) {
            state.streak++;
            burst(focused.x, focused.y - 14, state.member.color, 8);
            liveAnnouncer.textContent = focused.favorite === state.member.id
              ? "推しを見つけた！担当カラーにレス！"
              : "ファンにレスを届けた！";
            state.lastFocus = focused;
          } else if (!focused) {
            state.lastFocus = null;
          }

          if (state.remaining <= 0) finishLive(state.voltage >= state.goal);
          else if (state.voltage <= 0 && state.elapsed > 4) finishLive(false);
          else if (Math.floor(state.elapsed * 2) !== Math.floor((state.elapsed - dt) * 2)) updateHeader();
        }

        for (let index = particles.length - 1; index >= 0; index--) {
          const particle = particles[index];
          particle.life -= dt;
          particle.x += particle.vx * dt;
          particle.y += particle.vy * dt;
          particle.vy += 120 * dt;
          if (particle.life <= 0) particles.splice(index, 1);
        }
      }

      function drawBackground(now) {
        const venue = state.venue;
        const sky = ctx.createLinearGradient(0, 0, 0, 600);
        sky.addColorStop(0, "#13142d");
        sky.addColorStop(.52, venue?.wall || "#292145");
        sky.addColorStop(1, venue?.floor || "#493254");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, 960, 600);

        const glow = ctx.createRadialGradient(480, 272, 12, 480, 272, 425);
        glow.addColorStop(0, hexToRgba(state.member?.color || "#bc81ff", .2));
        glow.addColorStop(1, "rgba(36, 24, 57, 0)");
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, 960, 480);

        if (venue?.architecture === "theater") {
          ctx.strokeStyle = hexToRgba(venue.trim, .42);
          ctx.lineWidth = 5;
          for (let index = 0; index < 3; index++) {
            ctx.beginPath();
            ctx.moveTo(70 + index * 64, 263);
            ctx.quadraticCurveTo(95 + index * 64, 82, 120 + index * 64, 263);
            ctx.moveTo(840 - index * 64, 263);
            ctx.quadraticCurveTo(865 - index * 64, 82, 890 - index * 64, 263);
            ctx.stroke();
          }
          ctx.fillStyle = hexToRgba(venue.trim, .17);
          ctx.fillRect(0, 258, 960, 7);
        } else if (venue?.architecture === "warehouse") {
          ctx.strokeStyle = hexToRgba(venue.trim, .33);
          ctx.lineWidth = 8;
          for (let x = -100; x < 1100; x += 200) {
            ctx.beginPath();
            ctx.moveTo(x, 58);
            ctx.lineTo(x + 170, 179);
            ctx.lineTo(x + 340, 58);
            ctx.stroke();
          }
          ctx.strokeStyle = hexToRgba(venue.trim, .24);
          ctx.lineWidth = 4;
          ctx.strokeRect(40, 77, 880, 188);
          ctx.beginPath();
          ctx.moveTo(40, 169);
          ctx.lineTo(920, 169);
          ctx.stroke();
        } else if (venue?.architecture === "underground") {
          ctx.strokeStyle = hexToRgba(venue.trim, .4);
          ctx.lineWidth = 9;
          for (let y = 81; y < 230; y += 61) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(960, y + 24);
            ctx.stroke();
          }
          ctx.strokeStyle = hexToRgba(venue.lighting, .75);
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.moveTo(0, 190);
          ctx.lineTo(960, 214);
          ctx.stroke();
        } else if (venue?.architecture === "rooftop") {
          ctx.fillStyle = "rgba(10, 14, 33, .77)";
          for (let index = 0; index < 15; index++) {
            const x = index * 68 - 16;
            const height = 37 + (index * 37 % 66);
            ctx.fillRect(x, 275 - height, 47, height);
            ctx.fillStyle = hexToRgba(venue.lighting, .65);
            for (let y = 275 - height + 12; y < 270; y += 17) {
              ctx.fillRect(x + 9, y, 3, 5);
              ctx.fillRect(x + 28, y, 3, 5);
            }
            ctx.fillStyle = "rgba(10, 14, 33, .77)";
          }
          ctx.strokeStyle = hexToRgba(venue.trim, .8);
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(0, 277);
          ctx.lineTo(960, 277);
          ctx.stroke();
        } else if (venue?.architecture === "livehouse") {
          ctx.fillStyle = "rgba(12, 10, 23, .6)";
          ctx.fillRect(0, 42, 960, 26);
          ctx.strokeStyle = hexToRgba(venue.trim, .38);
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 81);
          ctx.quadraticCurveTo(480, 119, 960, 81);
          ctx.stroke();
          for (let index = 0; index < 13; index++) {
            const x = 35 + index * 74;
            const y = 82 + Math.sin(index / 12 * Math.PI) * 28;
            ctx.fillStyle = index % 2 ? "#ffc974" : venue.lighting;
            ctx.beginPath();
            ctx.arc(x, y, 5, 0, Math.PI * 2);
            ctx.fill();
          }
        }

        for (let index = 0; index < 3; index++) {
          const center = 480 + Math.sin(now * .0004 + index * 2.3) * 65;
          const beam = ctx.createRadialGradient(center, 135, 4, center, 322, 310);
          beam.addColorStop(0, hexToRgba(venue?.lighting || "#fff5ff", .06 + .025 * Math.sin(now * .001 + index)));
          beam.addColorStop(1, "rgba(207, 159, 255, 0)");
          ctx.fillStyle = beam;
          ctx.beginPath();
          ctx.moveTo(center - 18, 135);
          ctx.lineTo(center - 205, 462);
          ctx.lineTo(center + 205, 462);
          ctx.lineTo(center + 18, 135);
          ctx.closePath();
          ctx.fill();
        }

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "rgba(12, 10, 25, .92)";
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.moveTo(94, 73);
        ctx.quadraticCurveTo(480, 26, 866, 73);
        ctx.stroke();
        ctx.strokeStyle = hexToRgba(venue?.trim || "#c7a6ff", .62);
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(94, 70);
        ctx.quadraticCurveTo(480, 23, 866, 70);
        ctx.stroke();
        ctx.strokeStyle = "rgba(202, 189, 226, .22)";
        ctx.lineWidth = 1;
        for (let index = 0; index <= 12; index++) {
          const x = 112 + index * 63;
          const y = 69 - Math.sin(index / 12 * Math.PI) * 5;
          ctx.beginPath();
          ctx.moveTo(x, y - 5);
          ctx.lineTo(x, y + 6);
          ctx.stroke();
        }
        for (let index = 0; index < 7; index++) {
          const x = 164 + index * 106;
          const y = 61 - Math.sin(index / 6 * Math.PI) * 18;
          const glow = .65 + .25 * Math.sin(now * .002 + index);
          ctx.fillStyle = hexToRgba(index % 2 ? venue?.lighting || "#d4b8ff" : "#ffd98e", glow);
          ctx.shadowColor = ctx.fillStyle;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.moveTo(x - 5, y - 4);
          ctx.lineTo(x + 5, y - 4);
          ctx.lineTo(x + 7, y + 3);
          ctx.lineTo(x, y + 7);
          ctx.lineTo(x - 7, y + 3);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();

        ctx.fillStyle = "rgba(16, 15, 33, .85)";
        ctx.fillRect(0, 0, 960, 42);
        for (let index = 0; index < 19; index++) {
          const x = 25 + index * 51;
          ctx.fillStyle = index % 3 === 0 ? "#ffe4a8" : "#c3a5ff";
          ctx.globalAlpha = .45 + .22 * Math.sin(now * .003 + index * 2);

        ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,.16)";

      function drawIdols(positions) {
        const height = 126;
        members.forEach((member, index) => {
          const image = imageById[member.id];
          if (!image?.complete || !image.naturalWidth) return;

          const [centerX, baseY] = positions[index];
          const width = height * image.naturalWidth / image.naturalHeight;
          const x = centerX - width / 2;
          const y = baseY - height;
          const aura = ctx.createRadialGradient(centerX, baseY - 43, 7, centerX, baseY - 43, 75);
          aura.addColorStop(0, hexToRgba(member.color, .2));
          aura.addColorStop(1, hexToRgba(member.color, 0));
          ctx.fillStyle = aura;
          ctx.beginPath();
          ctx.ellipse(centerX, baseY - 43, 71, 79, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = "rgba(9, 9, 22, .45)";
          ctx.beginPath();
          ctx.ellipse(centerX, baseY + 1, 21, 5, 0, 0, Math.PI * 2);
          ctx.fill();

          ctx.save();
          ctx.shadowColor = hexToRgba(member.color, .36);
          ctx.shadowBlur = 11;
          ctx.drawImage(image, x, y, width, height);
          ctx.restore();

          ctx.fillStyle = "rgba(18, 15, 32, .78)";
          ctx.beginPath();
          ctx.roundRect(centerX - 45, baseY + 2, 90, 16, 8);
          ctx.fill();
          ctx.fillStyle = member.color;
          ctx.font = "700 8px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(member.name, centerX, baseY + 13, 84);
        });
      }

      function drawFan(fan, index, focused, now) {
        const color = members.find(member => member.id === fan.favorite)?.color || "#ddd7e8";
        const scale = fan.size;
        const x = fan.x;
        const bob = Math.sin(fan.wave + now * .001) * 1.25;
        const y = fan.y + bob;
        const morale = fan.morale / 100;
        const isFocused = focused === fan;
        const lightColor = fan.lit ? color : "#777487";
        const radius = 32 * scale;
        const raisedHandX = x + 17 * scale + (fan.cheers ? Math.sin(fan.wave) * 4 * scale : 0);
        const raisedHandY = y - 34 * scale;

        if (isFocused) {
          ctx.fillStyle = hexToRgba(state.member.color, .14);
          ctx.beginPath();
          ctx.arc(x, y - 5, radius + 15 + Math.sin(now * .012) * 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = hexToRgba(state.member.color, .9);
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.arc(x, y - 5, radius + 9, 0, Math.PI * 2);
          ctx.stroke();
        }

        const floorShadow = ctx.createRadialGradient(x, y + 22 * scale, 2, x, y + 22 * scale, 25 * scale);
        floorShadow.addColorStop(0, "rgba(6, 6, 18, .62)");
        floorShadow.addColorStop(1, "rgba(6, 6, 18, 0)");
        ctx.fillStyle = floorShadow;
        ctx.beginPath();
        ctx.ellipse(x, y + 22 * scale, 26 * scale, 8 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        const stickGradient = ctx.createLinearGradient(raisedHandX - 3 * scale, 0, raisedHandX + 3 * scale, 0);
        stickGradient.addColorStop(0, fan.lit ? hexToRgba(lightColor, .18) : "#484655");
        stickGradient.addColorStop(.38, fan.lit ? hexToRgba(lightColor, .85) : "#a8a0b0");
        stickGradient.addColorStop(.7, fan.lit ? hexToRgba(lightColor, .55) : "#625e70");
        stickGradient.addColorStop(1, fan.lit ? hexToRgba(lightColor, .08) : "#3c3949");

        ctx.save();
        ctx.shadowColor = fan.lit ? hexToRgba(lightColor, .9) : "transparent";
        ctx.shadowBlur = fan.lit ? 15 * scale : 0;
        ctx.fillStyle = stickGradient;
        ctx.beginPath();
        ctx.roundRect(raisedHandX - 2.5 * scale, y - 39 * scale, 5 * scale, 28 * scale, 2.5 * scale);
        ctx.fill();
        const capGradient = ctx.createRadialGradient(raisedHandX - scale, y - 37 * scale, 1, raisedHandX, y - 34 * scale, 7 * scale);
        capGradient.addColorStop(0, fan.lit ? "#fffdf2" : "#bdb8c6");
        capGradient.addColorStop(.38, fan.lit ? lightColor : "#777386");
        capGradient.addColorStop(1, fan.lit ? hexToRgba(lightColor, .15) : "#504c5e");
        ctx.fillStyle = capGradient;
        ctx.beginPath();
        ctx.ellipse(raisedHandX, y - 35 * scale, 5.2 * scale, 7 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = fan.lit ? "rgba(255,255,255,.82)" : "rgba(255,255,255,.32)";
        ctx.beginPath();
        ctx.ellipse(raisedHandX - 1.7 * scale, y - 35 * scale, 1.2 * scale, 3 * scale, -.24, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        ctx.save();
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = fan.skin;
        ctx.lineWidth = 5 * scale;
        ctx.beginPath();
        ctx.moveTo(x + 7 * scale, y + 3 * scale);
        ctx.quadraticCurveTo(x + 15 * scale, y - 1 * scale, raisedHandX - 1 * scale, raisedHandY + 6 * scale);
        ctx.stroke();
        ctx.strokeStyle = hexToRgba("#fff7ef", .44);
        ctx.lineWidth = 1.2 * scale;
        ctx.beginPath();
        ctx.moveTo(x + 9 * scale, y + 2 * scale);
        ctx.quadraticCurveTo(x + 15 * scale, y - 3 * scale, raisedHandX - 2 * scale, raisedHandY + 8 * scale);
        ctx.stroke();
        ctx.restore();

        ctx.fillStyle = "rgba(5, 6, 16, .55)";
        ctx.beginPath();
        ctx.ellipse(x, y + 15 * scale, 13 * scale, 6 * scale, 0, 0, Math.PI * 2);
        ctx.fill();

        const bodyGradient = ctx.createLinearGradient(x - 12 * scale, y, x + 12 * scale, y + 20 * scale);
        bodyGradient.addColorStop(0, hexToRgba(fan.outfit, 1.08));
        bodyGradient.addColorStop(.35, fan.outfit);
        bodyGradient.addColorStop(.76, "#282537");
        bodyGradient.addColorStop(1, "#171724");
        ctx.fillStyle = bodyGradient;
        ctx.beginPath();
        ctx.moveTo(x - 4 * scale, y);
        ctx.lineTo(x + 4 * scale, y);
        ctx.quadraticCurveTo(x + 11 * scale, y, x + 13 * scale, y + 7 * scale);
        ctx.lineTo(x + 11 * scale, y + 19 * scale);
        ctx.quadraticCurveTo(x, y + 23 * scale, x - 11 * scale, y + 19 * scale);
        ctx.lineTo(x - 13 * scale, y + 7 * scale);
        ctx.quadraticCurveTo(x - 11 * scale, y, x - 4 * scale, y);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,.27)";
        ctx.lineWidth = 1 * scale;
        ctx.stroke();

        ctx.strokeStyle = hexToRgba(color, .82);
        ctx.lineWidth = 1.7 * scale;
        ctx.beginPath();
        ctx.moveTo(x - 5 * scale, y + 3 * scale);
        ctx.lineTo(x, y + 10 * scale);
        ctx.lineTo(x + 5 * scale, y + 3 * scale);
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,.62)";
        ctx.fillRect(x - 8 * scale, y + 14 * scale, 3 * scale, 1.1 * scale);
        ctx.fillRect(x + 5 * scale, y + 14 * scale, 3 * scale, 1.1 * scale);

        ctx.save();
        ctx.lineCap = "round";
        ctx.strokeStyle = fan.skin;
        ctx.lineWidth = 4 * scale;
        ctx.beginPath();
        ctx.moveTo(x - 8 * scale, y + 5 * scale);
        ctx.quadraticCurveTo(x - 14 * scale, y + 7 * scale, x - 15 * scale, y + 12 * scale);
        ctx.stroke();
        ctx.strokeStyle = hexToRgba("#fff7ef", .4);
        ctx.lineWidth = 1 * scale;
        ctx.beginPath();
        ctx.moveTo(x - 9 * scale, y + 4 * scale);
        ctx.lineTo(x - 13 * scale, y + 8 * scale);
        ctx.stroke();
        ctx.restore();

        const headX = x;
        const headY = y - 12 * scale;
        const headRadius = 9.3 * scale;
        const backHair = ctx.createLinearGradient(headX - 12 * scale, headY - 5 * scale, headX + 9 * scale, headY + 14 * scale);
        backHair.addColorStop(0, "#777184");
        backHair.addColorStop(.16, fan.hair);
        backHair.addColorStop(.78, "#171621");
        backHair.addColorStop(1, "#0e101b");
        ctx.fillStyle = backHair;
        ctx.beginPath();
        ctx.ellipse(headX, headY - 1 * scale, 11.6 * scale, 12.4 * scale, 0, Math.PI, Math.PI * 2);
        ctx.lineTo(headX + 11 * scale, headY + 8 * scale);
        ctx.quadraticCurveTo(headX + 7 * scale, headY + 5 * scale, headX + 6 * scale, headY + 1 * scale);
        ctx.quadraticCurveTo(headX, headY + 5 * scale, headX - 7 * scale, headY + 1 * scale);
        ctx.lineTo(headX - 10 * scale, headY + 8 * scale);
        ctx.closePath();
        ctx.fill();

        const skinGradient = ctx.createRadialGradient(headX - 3 * scale, headY - 5 * scale, 1 * scale, headX, headY, 12 * scale);
        skinGradient.addColorStop(0, "#fff0e4");
        skinGradient.addColorStop(.55, fan.skin);
        skinGradient.addColorStop(1, "#cd9886");
        ctx.fillStyle = skinGradient;
        ctx.beginPath();
        ctx.ellipse(headX, headY, headRadius, 10.1 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(59, 38, 51, .5)";
        ctx.lineWidth = .8 * scale;
        ctx.stroke();

        ctx.fillStyle = fan.hair;
        ctx.beginPath();
        ctx.moveTo(headX - 10 * scale, headY - 2 * scale);
        ctx.quadraticCurveTo(headX - 11 * scale, headY - 12 * scale, headX - 3 * scale, headY - 13 * scale);
        ctx.quadraticCurveTo(headX + 8 * scale, headY - 16 * scale, headX + 11 * scale, headY - 5 * scale);
        ctx.quadraticCurveTo(headX + 7 * scale, headY - 9 * scale, headX + 4 * scale, headY - 7 * scale);
        ctx.lineTo(headX + 1 * scale, headY - 3 * scale);
        ctx.lineTo(headX - 1 * scale, headY - 7 * scale);
        ctx.lineTo(headX - 5 * scale, headY - 2 * scale);
        ctx.lineTo(headX - 7 * scale, headY - 5 * scale);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "rgba(255,243,235,.35)";
        ctx.beginPath();
        ctx.ellipse(headX - 3 * scale, headY - 7 * scale, 3 * scale, 1.5 * scale, -.4, 0, Math.PI * 2);
        ctx.fill();

        for (const eyeOffset of [-3.6, 3.6]) {
          ctx.fillStyle = "rgba(83, 47, 60, .85)";
          ctx.beginPath();
          ctx.ellipse(headX + eyeOffset * scale, headY + .2 * scale, 1.5 * scale, 2.1 * scale, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = "#fff8ef";
          ctx.beginPath();
          ctx.arc(headX + (eyeOffset - .4) * scale, headY - .6 * scale, .65 * scale, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.fillStyle = hexToRgba("#ed8298", .46);
        ctx.beginPath();
        ctx.ellipse(headX - 5.5 * scale, headY + 3.3 * scale, 2.2 * scale, 1 * scale, 0, 0, Math.PI * 2);
        ctx.ellipse(headX + 5.5 * scale, headY + 3.3 * scale, 2.2 * scale, 1 * scale, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "rgba(119, 60, 73, .78)";
        ctx.lineWidth = .9 * scale;
        ctx.beginPath();
        ctx.moveTo(headX - 1.6 * scale, headY + 4 * scale);
        ctx.quadraticCurveTo(headX, headY + 5.6 * scale, headX + 1.6 * scale, headY + 4 * scale);
        ctx.stroke();

        ctx.fillStyle = "rgba(255, 255, 255, .76)";
        ctx.beginPath();
        ctx.arc(headX + 5 * scale, headY - 7 * scale, .9 * scale, 0, Math.PI * 2);
        ctx.fill();

        if (fan.cheers) {
          ctx.strokeStyle = hexToRgba(color, fan.lit ? .83 : .32);
          ctx.lineWidth = 1 * scale;
          ctx.beginPath();
          ctx.arc(raisedHandX, y - 35 * scale, 7.6 * scale, -2.35, -1.12);
          ctx.stroke();
        }

        if (isFocused) {
          ctx.font = "700 8px sans-serif";
          ctx.textAlign = "center";
          ctx.fillStyle = "#fff2c9";
          if (!fan.lit) ctx.fillText("NEW FAN!", x, y - 48 * scale);
        }
      }

      function drawPillars() {
        if (!state.venue) return;
        for (const pillar of state.venue.pillars) {
          const gradient = ctx.createLinearGradient(pillar.x, 0, pillar.x + pillar.width, 0);
          gradient.addColorStop(0, "rgba(12, 12, 27, .96)");
          gradient.addColorStop(.24, hexToRgba(state.venue.trim, .72));
          gradient.addColorStop(.48, "rgba(29, 24, 42, .97)");
          gradient.addColorStop(.82, hexToRgba(state.venue.trim, .42));
          gradient.addColorStop(1, "rgba(12, 12, 27, .98)");
          ctx.fillStyle = gradient;
          ctx.fillRect(pillar.x, pillar.top, pillar.width, pillar.bottom - pillar.top);
          ctx.fillStyle = hexToRgba(state.venue.trim, .84);
          ctx.fillRect(pillar.x - 4, pillar.top, pillar.width + 8, 5);
          ctx.fillStyle = "rgba(8, 8, 21, .92)";
          ctx.fillRect(pillar.x - 6, pillar.bottom - 4, pillar.width + 12, 8);
          ctx.fillStyle = hexToRgba(state.venue.lighting, .48);
          ctx.fillRect(pillar.x + 5, pillar.top + 13, 2, pillar.bottom - pillar.top - 26);
        }
      }

      function drawAim(focused, now) {
        if (!pointer.active || state.mode !== "playing") return;
        const memberIndex = members.findIndex(member => member === state.member);
        const [eyeX, memberY] = state.idolPositions[memberIndex] || [480, 328];
        const eyeY = memberY - 96;
        const targetX = focused ? focused.x : pointer.x;
        const targetY = focused ? focused.y - 10 : pointer.y;

        ctx.save();
        ctx.setLineDash([4, 6]);
        ctx.strokeStyle = hexToRgba(state.member.color, focused ? .55 : .25);
        ctx.lineWidth = focused ? 2 : 1;
        ctx.beginPath();
        ctx.moveTo(eyeX, eyeY);
        ctx.lineTo(targetX, targetY);
        ctx.stroke();
        ctx.setLineDash([]);

        const pulse = 9 + Math.sin(now * .012) * 2;
        ctx.strokeStyle = state.member.color;
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(targetX, targetY, focused ? pulse : 8, 0, Math.PI * 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(targetX - 13, targetY);
        ctx.lineTo(targetX + 13, targetY);
        ctx.moveTo(targetX, targetY - 13);
        ctx.lineTo(targetX, targetY + 13);
        ctx.stroke();
        ctx.restore();
      }

      function drawParticles() {
        for (const particle of particles) {
          ctx.globalAlpha = clamp(particle.life / particle.maxLife, 0, 1);
          ctx.fillStyle = particle.color;
          ctx.beginPath();
          ctx.arc(particle.x, particle.y, particle.size, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.globalAlpha = 1;
      }

      function drawCenterCue(now) {
        if (state.mode !== "playing") return;
        const chorus = isChorus(state.elapsed);
        ctx.save();
        ctx.textAlign = "center";
        ctx.font = "800 12px sans-serif";
        ctx.fillStyle = chorus ? "#ffe8a6" : "rgba(255,255,255,.82)";
        ctx.shadowColor = chorus ? "#ffb9cf" : "transparent";
        ctx.shadowBlur = chorus ? 14 : 0;
        const blocked = blockedFanAtPointer();
        ctx.fillText(blocked
          ? "柱が視線をさえぎってる！ほかのファンにレスしよう"
          : chorus ? "✦ サビ！レスの効果アップ ✦" : "あなたの視線を待ってるよ ✧", 480, 86);
        if (state.feverSeconds > 0) {
          ctx.font = "900 29px sans-serif";
          ctx.fillStyle = `rgba(255, 226, 155, ${.7 + .25 * Math.sin(now * .012)})`;
          ctx.fillText("FEVER ✨", 480, 123);
        }
        ctx.restore();
      }

      function render(now) {
        ctx.clearRect(0, 0, 960, 600);
        drawBackground(now);
        const positions = getIdolPositions(state.elapsed, now);
        state.idolPositions = positions;
        const focused = focusFan();
        const orderedFans = [...fans].sort((a, b) => a.row - b.row || a.x - b.x);
        orderedFans.forEach((fan, index) => drawFan(fan, index, focused, now));
        drawPillars();
        drawIdols(positions);
        drawAim(focused, now);
        drawParticles();
        drawCenterCue(now);

        if (state.mode === "playing" && state.voltage >= state.goal) {
          ctx.save();
          ctx.fillStyle = "rgba(255, 228, 166, .9)";
          ctx.font = "900 19px sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("目標達成！このままキープ！", 480, 106);
          ctx.restore();
        }
      }

      let previousTime = performance.now();
      function frame(now) {
        const dt = Math.min((now - previousTime) / 1000, .05);
        previousTime = now;
        update(dt);
        render(now);
        requestAnimationFrame(frame);
      }

      function setPointer(event) {
        const rect = stage.getBoundingClientRect();
        pointer.x = (event.clientX - rect.left) * 960 / rect.width;
        pointer.y = (event.clientY - rect.top) * 600 / rect.height;
      }

      stage.addEventListener("pointermove", event => {
        setPointer(event);
        pointer.active = true;
      });
      stage.addEventListener("pointerdown", event => {
        setPointer(event);
        pointer.active = true;
        pointer.down = true;
        stage.setPointerCapture(event.pointerId);
      });
      stage.addEventListener("pointerup", () => { pointer.down = false; });
      stage.addEventListener("pointercancel", () => { pointer.down = false; });
      stage.addEventListener("pointerleave", () => {
        if (!pointer.down) pointer.active = false;
      });
      stage.addEventListener("pointerenter", event => {
        setPointer(event);
        pointer.active = true;
      });
      musicToggle.addEventListener("click", () => {
        if (!bgm.paused && !bgm.ended) {
          bgm.pause();
          updateMusicControl();
        } else {
          playBgm();
        }
      });
      bgm.addEventListener("play", updateMusicControl);
      bgm.addEventListener("pause", updateMusicControl);
      bgm.addEventListener("ended", updateMusicControl);
      bgm.addEventListener("error", () => {
        musicError = true;
        updateMusicControl();
        liveAnnouncer.textContent = "BGMファイルを読み込めませんでした。musicフォルダーを確認してください。";
        console.error("Failed to load the stage BGM file.", bgm.error);
      });
      startButton.addEventListener("click", () => beginLive(state.mode === "cleared"));
      feverButton.addEventListener("click", activateFever);
      document.addEventListener("keydown", event => {
        if (event.code === "Space" && state.mode === "playing") {
          event.preventDefault();
          activateFever();
        }
      });
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();
      updateHeader();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
